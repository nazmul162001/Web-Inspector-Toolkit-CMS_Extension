<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Images fixture</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .hero { height: 260px; background: url(images/hero.svg) center / cover no-repeat; color: #fff; display: grid; place-items: center; }
  .hero h1 { margin: 0; font-size: 40px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .row { display: flex; gap: 24px; padding: 24px; }
  .photo { width: 300px; height: 200px; display: block; }
  .tile { width: 300px; height: 200px; background: url(images/pattern.svg) repeat; }
  .badge { position: absolute; left: 24px; top: 300px; padding: 4px 10px; background: rgba(0,0,0,.6); color: #fff; }
  .card { position: relative; width: 300px; height: 200px; }
  .card .over { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 22px; text-shadow: 0 1px 4px #000; }
</style></head>
<body>
  <section class="hero"><h1>Text over a background image</h1></section>
  <div class="row">
    <div class="card"><img class="photo" src="images/photo.svg" alt="A photo"><div class="over">Overlay text on photo</div></div>
    <div class="tile"></div>
  </div>
</body></html>
